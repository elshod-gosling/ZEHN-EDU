name: Test and publish website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Check website and combat
        run: |
          node --check dist/app.js
          node --check dist/arena/game.mjs
          node --check dist/arena/high-graphics.mjs
          node verify.mjs
          node arena-tests.mjs
          node block-tests.mjs
          node --check dist/account.mjs
          node --check dist/supabase-account.mjs
          node --check dist/credits-ui.mjs
          node mouse-tests.mjs
          node loop-tests.mjs
          node entry-tests.mjs
          node credit-tests.mjs
          node account-tests.mjs
          npm ci --ignore-scripts --no-audit --no-fund
          node supabase-tests.mjs
          node room-tests.mjs
          node podium-tests.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
